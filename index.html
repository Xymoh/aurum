<!doctype html>
<html lang="en" data-light-theme="%VITE_LIGHT_THEME%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aurum - Score your gear in Genshin Impact, Honkai: Star Rail and Zenless Zone Zero. Enter a UID to see which pieces are worth investing in." />
    <meta property="og:title" content="Aurum" />
    <meta property="og:description" content="Gear scoring for gacha games. Genshin Impact, Honkai: Star Rail and Zenless Zone Zero." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurumgg.com/" />
    <meta property="og:image" content="https://aurumgg.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Every showcase pulls its art from these two hosts; opening the
         connections early takes a round trip off the first image. No
         crossorigin: plain <img> requests use the credentialed connection
         pool, so an anonymous preconnect would go unused. -->
    <link rel="preconnect" href="https://enka.network" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <!-- Fonts are self-hosted (see src/main.tsx): a remote Google Fonts
         stylesheet would send every visitor's IP to Google before consent. -->
    <title>Aurum - Gear scoring for gacha games</title>
    <!-- public/_headers allows this script by its hash, so its text must not
         change with the build: the flag arrives on <html> instead. -->
    <script>
      // Apply the saved theme before first paint so light-mode visitors never
      // see a dark flash. src/lib/theme.ts owns every change after this.
      // Parked: unless VITE_LIGHT_THEME is "on" (Vite fills it in on <html>)
      // the page stays dark, whatever was saved or the OS prefers.
      (function() {
        if (document.documentElement.getAttribute('data-light-theme') !== 'on') return;
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
