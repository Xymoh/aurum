<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aurum - Score your gear in Genshin Impact, Honkai: Star Rail and Zenless Zone Zero. Enter a UID to see which pieces are worth investing in." />
    <meta property="og:title" content="Aurum" />
    <meta property="og:description" content="Gear scoring for gacha games. Genshin Impact, Honkai: Star Rail and Zenless Zone Zero." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xymoh.github.io/aurum/" />
    <meta name="twitter:card" content="summary" />
    <!-- Every showcase pulls its art from these two hosts; opening the
         connections early takes a round trip off the first image. -->
    <link rel="preconnect" href="https://enka.network" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Fonts are self-hosted (see src/main.tsx): a remote Google Fonts
         stylesheet would send every visitor's IP to Google before consent. -->
    <title>Aurum - Gear scoring for gacha games</title>
    <script>
      // Apply the saved theme before first paint so light-mode visitors never
      // see a dark flash. src/lib/theme.ts owns every change after this.
      // Parked: unless VITE_LIGHT_THEME is "on" (Vite fills it in) the page
      // stays dark, whatever was saved or the OS prefers.
      (function() {
        if ('%VITE_LIGHT_THEME%' !== 'on') return;
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script>
      // GitHub Pages SPA routing - handle redirect from 404.html
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
