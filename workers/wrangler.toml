# Cloudflare Worker config for the Enka relay. Deployed by
# .github/workflows/deploy-worker.yml on every push to main that touches
# this folder, or by hand from the repo root:
#
#   npx wrangler deploy --config workers/wrangler.toml
name = "enka-proxy"
main = "enka-proxy.js"
compatibility_date = "2024-01-01"

# The site calls the relay at enka-proxy.<subdomain>.workers.dev (VITE_ENKA_PROXY),
# so that address must stay on whatever domains or routes the Worker gains.
workers_dev = true

# ALLOWED_ORIGINS is set in the Cloudflare dashboard, not here, so a deploy
# never wipes it.
keep_vars = true

# The privacy policy says the relay keeps no logs; pinned here so a dashboard
# toggle cannot quietly start storing visitors' IPs and UIDs.
[observability]
enabled = false
