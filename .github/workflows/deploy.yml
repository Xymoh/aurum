name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per branch or pull request, so a pull request's checks can never
# cancel a deploy of main that is already running.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and pull request is checked; only a push to main deploys.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
        env:
          # Required: URL of the self-hosted Enka proxy (see workers/enka-proxy.js).
          # There is no public-proxy fallback, so a build without it cannot
          # look up showcases.
          VITE_ENKA_PROXY: ${{ vars.VITE_ENKA_PROXY }}
          # Feature gates, off unless the repository variable is "on":
          # extra languages, the showcase help pages (which need their
          # screenshots in public/help/ first), and the light theme.
          VITE_I18N: ${{ vars.VITE_I18N }}
          VITE_SHOWCASE_HELP: ${{ vars.VITE_SHOWCASE_HELP }}
          VITE_LIGHT_THEME: ${{ vars.VITE_LIGHT_THEME }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: dist

  # The site itself: Cloudflare Pages, served at aurumgg.com.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Holds the Cloudflare secrets once they are moved out of the repository
    # secrets (Settings -> Environments -> production, deployments from main
    # only), so a workflow on any other branch cannot read the token.
    environment: production
    steps:
      # wrangler bundles functions/ (showcase link previews) from the checkout;
      # those files import data and helpers from src/.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Same two repository secrets as the Enka relay's deploy; the API token
      # needs the "Cloudflare Pages: Edit" permission as well.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # An exact release, bumped on purpose: this step holds the API token.
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=aurum --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true

  # The old xymoh.github.io/aurum/ address: one page that forwards every
  # path to the same path on aurumgg.com.
  # Runs only once the new site deployed, so the old address never forwards to nothing.
  legacy-redirect:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: mkdir out && cp legacy-redirect/index.html out/index.html && cp legacy-redirect/index.html out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
